# Gera a ISO LIVE do OSHL (mesmo processo do Bazzite: Titanoboa).
# O pendrive inicia um ambiente live com o instalador; o sistema instalado
# e a imagem ghcr.io/<usuario>/oshl:latest e recebe atualizacoes dela.
# Rodar manualmente: aba Actions > "ISO OSHL" > Run workflow.
name: ISO OSHL

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Versao fixa do instalador do Bazzite (atualize quando quiser as novidades deles)
  BAZZITE_REF: 264aca11a6bf3dfa2ab68c98315268a65ab9618b

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Liberar espaco em disco
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: Armazenamento extra para containers
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service || true
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service || true

      - name: Baixar instalador do Bazzite
        uses: actions/checkout@v5
        with:
          repository: ublue-os/bazzite
          ref: ${{ env.BAZZITE_REF }}
          path: bazzite
          sparse-checkout: installer

      - name: Adaptar instalador para o OSHL
        run: |
          cd bazzite/installer
          # Procurar a imagem "oshl" em vez de "bazzite*"
          sed -i "s/'bazzite\*'/'oshl*'/" titanoboa_hook_postrootfs.sh titanoboa_hook_preinitramfs.sh
          # Imagem do OSHL nao e assinada (cosign): nao exigir assinatura no bootc switch
          sed -i 's/--enforce-container-sigpolicy //' titanoboa_hook_postrootfs.sh
          # OSHL e sempre NVIDIA: aplicar os ajustes NVIDIA do instalador
          sed -i 's/\*-nvidia\*/*/' titanoboa_hook_postrootfs.sh
          grep -n "oshl\*" titanoboa_hook_postrootfs.sh titanoboa_hook_preinitramfs.sh

      - name: Definir nomes
        run: |
          echo "PAYLOAD=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oshl:latest" >> "$GITHUB_ENV"
          echo "TAG=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Montar ambiente live com o instalador
        run: |
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE=ghcr.io/ublue-os/bazzite:stable \
            --build-arg INSTALL_IMAGE_PAYLOAD="$PAYLOAD" \
            --build-arg FLATPAK_DIR_SHORTNAME=kde_flatpaks \
            -t localhost/payload:latest bazzite/installer/

      - name: Gerar ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/payload:latest
          iso-dest: upload/OSHL-${{ env.TAG }}.iso

      - name: Checksum
        run: |
          cd upload
          sha256sum OSHL-*.iso | tee "OSHL-$TAG.iso.sha256"
          ls -lh

      - name: Disponibilizar ISO para download
        uses: actions/upload-artifact@v4
        with:
          name: OSHL-${{ env.TAG }}
          path: upload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
