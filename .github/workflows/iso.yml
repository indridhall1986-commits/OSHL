# Gera a ISO instaladora a partir da imagem publicada.
# Rodar manualmente: aba Actions > "ISO OSHL" > Run workflow.
name: ISO OSHL

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Liberar espaco em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - name: Definir nome
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oshl:latest" >> "$GITHUB_ENV"
          echo "TAG=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Baixar imagem do OSHL
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE"

      # A ISO aponta para a imagem do GHCR: o sistema instalado recebe atualizacoes dela.
      - name: Gerar ISO
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v ./iso.toml:/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs \
            "$IMAGE"
          sudo mv output/bootiso/install.iso "output/OSHL-$TAG.iso"
          sudo chown -R "$(id -u):$(id -g)" output
          ls -lh output

      - name: Disponibilizar ISO para download
        uses: actions/upload-artifact@v4
        with:
          name: OSHL-${{ env.TAG }}
          path: output/OSHL-*.iso
          compression-level: 0
          retention-days: 3
