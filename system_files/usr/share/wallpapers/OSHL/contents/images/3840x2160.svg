  <!-- Cantoneiras -->
  <g fill="none" stroke="#aacfd1" stroke-opacity="0.4" stroke-width="3">
    <path d="M60 180 V60 H180"/>
    <path d="M3780 180 V60 H3660"/>
    <path d="M60 1980 V2100 H180"/>
    <path d="M3780 1980 V2100 H3660"/>
