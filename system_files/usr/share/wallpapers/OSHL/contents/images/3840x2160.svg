<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0b1720"/>
      <stop offset="1" stop-color="#05080d"/>
    </radialGradient>
    <pattern id="hex" width="84" height="145.5" patternUnits="userSpaceOnUse">
      <path d="M42 0 L84 24.25 L84 72.75 L42 97 L0 72.75 L0 24.25 Z M42 97 L42 145.5"
            fill="none" stroke="#aacfd1" stroke-opacity="0.05" stroke-width="1.5"/>
