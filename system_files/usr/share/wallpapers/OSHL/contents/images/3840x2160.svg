    <path d="M-520 0 H-440 M440 0 H520 M0 -520 V-440 M0 440 V520" stroke-opacity="0.35" stroke-width="2"/>
  </g>
  <text x="1720" y="1000" text-anchor="middle" fill="#aacfd1" fill-opacity="0.75"
